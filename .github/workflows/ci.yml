name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rosa-tool:
    name: Build rosa-tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          node: 'false'

      - name: Build and test
        run: mvn verify --no-transfer-progress
        working-directory: rosa-tool

  rosa-viewer:
    name: Build rosa-viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          java: 'false'

      - name: Install dependencies
        run: npm ci
        working-directory: rosa-viewer

      - name: Lint
        run: npm run lint
        working-directory: rosa-viewer

      - name: Check formatting
        run: npm run format:check
        working-directory: rosa-viewer

      - name: Run tests
        run: npm test
        working-directory: rosa-viewer

      - name: Build library
        run: npm run build
        working-directory: rosa-viewer

      - name: Build sites
        run: npm run build:sites
        working-directory: rosa-viewer

  rosa-search:
    name: Test rosa-search Lambdas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Run Lambda tests
        run: python3 -m unittest discover -s tests -v
        working-directory: rosa-search/lambda

  cloudfront-functions:
    name: Test CloudFront Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          java: 'false'

      - name: Run function tests
        run: node --test 'jhu-rosa2-tf/modules/rosa2-image-server/functions/test/*.test.mjs'

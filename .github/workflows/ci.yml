name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rosa-tool:
    name: Build rosa-tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build and test
        run: mvn verify --no-transfer-progress
        working-directory: rosa-tool

  rosa-viewer:
    name: Build rosa-viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rosa-viewer/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: rosa-viewer

      - name: Lint
        run: npm run lint
        working-directory: rosa-viewer

      - name: Check formatting
        run: npm run format:check
        working-directory: rosa-viewer

      - name: Run tests
        run: npm test
        working-directory: rosa-viewer

      - name: Build library
        run: npm run build
        working-directory: rosa-viewer

      - name: Build sites
        run: npm run build:sites
        working-directory: rosa-viewer

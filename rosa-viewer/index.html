<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Rosa Viewer - Browse and search digitized book collections" />
    <title>Rosa Viewer</title>
    <style>
      html, body, #rosa-viewer {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="rosa-viewer"></div>
    <script>
      // Configuration for rosa-viewer
      // The viewer will fetch the IIIF collection and discover the JHSearchService
      window.rosaViewerConfig = {
        id: 'rosa-viewer',
        jhsearch: {
          // IIIF Presentation API base URL (must be absolute to match manifest IDs)
          iiifBaseUrl: 'http://localhost:3000/iiif',
          
          // Top-level collection ID - the viewer will load /iiif/dlmm/collection.json
          // and discover the JHSearchService configuration from there
          collectionId: 'aor',
          
          // Child collections that are part of this collection
          childCollectionIds: [],
          
          // IIIF Image API base URL for thumbnails
          imageBaseUrl: 'https://image.library.jhu.edu/iiif',
          
          // Logo base URL (served from public/logo/)
          logoBaseUrl: '/logo',
        },
      };
    </script>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
